[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai"
version = "0.1.0"
description = "ForgeAI - the agent that builds agents: brief + documents -> tested, optimized RAG agent with an honest report"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
  "typer>=0.9",
  "rich>=13",
  "openai>=1.30",
  "httpx>=0.25",
  "jinja2>=3.1",
  "numpy>=1.24",
  "rank_bm25>=0.2.2",
  "rapidfuzz>=3.0",
  "scikit-learn>=1.2",
  "pypdf>=4.0",
  "python-docx>=1.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=2.2"]
ui = ["streamlit>=1.30"]
synth = ["reportlab>=4.0"]
dev = ["pytest>=7", "reportlab>=4.0"]

[project.scripts]
forge = "forge.cli:app"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:langsmith_plugin -p no:anyio"
markers = ["slow: slower integration tests"]
