AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ForgeAI (Agent Smith) on AWS: ECS Fargate behind an Application Load Balancer, API key in Secrets Manager,
  logs + Container Insights in CloudWatch, CPU target-tracking autoscaling, and circuit-breaker rollback deploys.

Parameters:
  ImageUri:
    Type: String
    Description: Container image, e.g. <account>.dkr.ecr.<region>.amazonaws.com/forgeai:<git-sha>
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different AZs (ALB requirement)
  GroqApiKey:
    Type: String
    NoEcho: true
    Description: Hosted LLM API key, stored in Secrets Manager (never in the task definition)
  CertificateArn:
    Type: String
    Default: ""
    Description: Optional ACM certificate ARN; when set, HTTPS on 443 and HTTP redirects to it
  Cpu:
    Type: Number
    Default: 1024
    AllowedValues: [512, 1024, 2048, 4096]
  Memory:
    Type: Number
    Default: 2048
    AllowedValues: [1024, 2048, 3072, 4096, 8192]
  MinTasks:
    Type: Number
    Default: 1
  MaxTasks:
    Type: Number
    Default: 3

Conditions:
  HasCert: !Not [!Equals [!Ref CertificateArn, ""]]

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: 30

  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/forge-api-key
      SecretString: !Ref GroqApiKey

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-forge-api-key
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ApiKeySecret

  TaskRole:   # the app itself needs no AWS permissions (least privilege)
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ForgeAI load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ForgeAI tasks, reachable only from the load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8501, ToPort: 8501, SourceSecurityGroupId: !Ref AlbSecurityGroup}

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds   # Streamlit keeps a websocket open during long builds
          Value: "900"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8501
      HealthCheckPath: /_stcore/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - {Key: stickiness.enabled, Value: "true"}          # a Streamlit session must stay on one task
        - {Key: stickiness.type, Value: lb_cookie}
        - {Key: stickiness.lb_cookie.duration_seconds, Value: "86400"}
        - {Key: deregistration_delay.timeout_seconds, Value: "30"}

  HttpListener:   # forwards to the app, or redirects to HTTPS when a certificate is given
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCert
          - Type: redirect
            RedirectConfig: {Protocol: HTTPS, Port: "443", StatusCode: HTTP_301}
          - Type: forward
            TargetGroupArn: !Ref TargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCert
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - {Type: forward, TargetGroupArn: !Ref TargetGroup}

  ListenersReady:   # the service may only register targets once its listener(s) exist; works with or without HTTPS
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      Http: !Ref HttpListener
      Https: !If [HasCert, !Ref HttpsListener, !Ref AWS::NoValue]

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}-forgeai
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: forgeai
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ContainerPort: 8501, Protocol: tcp}]
          Environment:
            - {Name: FORGE_UI_CONFIG, Value: configs/cloud_groq.toml}
          Secrets:
            - {Name: FORGE_API_KEY, ValueFrom: !Ref ApiKeySecret}
          HealthCheck:
            Command: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)\" || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: forgeai

  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenersReady
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref MinTasks
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 100     # zero-downtime rolling deploys
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED      # public subnets: no NAT gateway cost; tasks still only accept ALB traffic
          Subnets: !Ref PublicSubnetIds
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - {ContainerName: forgeai, ContainerPort: 8501, TargetGroupArn: !Ref TargetGroup}

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub service/${Cluster}/${Service.Name}
      MinCapacity: !Ref MinTasks
      MaxCapacity: !Ref MaxTasks

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${AWS::StackName}-cpu-target
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification: {PredefinedMetricType: ECSServiceAverageCPUUtilization}
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

Outputs:
  Url:
    Description: Public URL of the app
    Value: !If [HasCert, !Sub "https://${LoadBalancer.DNSName}", !Sub "http://${LoadBalancer.DNSName}"]
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  LogGroup:
    Value: !Ref LogGroup
