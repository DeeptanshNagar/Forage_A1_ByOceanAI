name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (offline, mock backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests -q

  lint-infra:
    name: Lint Dockerfile + CloudFormation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install cfn-lint
      - run: cfn-lint deploy/aws/cloudformation.yml --non-zero-exit-code error

  docker:
    name: Build, smoke-test and publish image
    runs-on: ubuntu-latest
    needs: [tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: forgeai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (container health + app renders without errors)
        run: |
          docker run -d --name forge -p 8501:8501 forgeai:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8501/_stcore/health; then echo " healthy after ${i}s"; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8501/_stcore/health
          docker exec forge python -c "
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('forge/runner/app_ui.py', default_timeout=180).run()
          assert not at.exception, [e.value for e in at.exception]
          print('app rendered:', len(at.tabs), 'tabs,', len(at.metric), 'metrics')
          "
          docker inspect --format '{{.State.Health.Status}} as user {{.Config.User}}' forge
      - name: Show container logs on failure
        if: failure()
        run: docker logs forge || true
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
